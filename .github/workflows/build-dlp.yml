# =============================================================================
# DirettaLocalPlayer —— GitHub Actions 云端编译
#
# 放到仓库的 .github/workflows/build-dlp.yml
#
# 用法：
#   1. 你在仓库里无脑点： Actions → Build DirettaLocalPlayer → Run workflow
#      编完到本次运行页面底部下载 Artifact（需登录 GitHub）
#   2. 想吃 Release 直链（Armbian 上 wget 直接下）：
#          git tag v1.0 && git push origin v1.0
#      或者手动触发时在 release_tag 里填个名字
#
# 前置条件（必读）：仓库里必须有 Diretta Host SDK，见文件末尾注释的两种配法
# =============================================================================
name: Build DirettaLocalPlayer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填了就创建同名 Release 并附上二进制（不填只出 Artifact）'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# 创建 Release / 上传附件需要写权限
permissions:
  contents: write

# CMakeLists.txt 里读的是「环境变量」DIRETTA_SDK_PATH，不是 -D 参数，别写错
env:
  DIRETTA_SDK_PATH: ${{ github.workspace }}/DirettaHostSDK
  # 强制优先用源码构建的 FFmpeg（/usr/local），否则会被系统自带的 FFmpeg 4.4 抢先解析
  # （PKG_CONFIG_PATH 是「前置」到默认搜索路径，不是替换）
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false          # 一个架构挂了另一个继续编
      matrix:
        include:
          # ---- glibc 2.35 / FFmpeg 4.4：兼容优先（Debian 11+ / Ubuntu 22.04+ 都能跑）----
          - runner: ubuntu-22.04
            arch: x64
            sdk_arch: x64-linux-15v2        # 基线 x86-64（-march=x86-64，不用 AVX2），兼容面最广
            ffmpeg_ver: '5.1.2'             # 见下方「Build FFmpeg from source」注释，可改 7.1 / 8.0.1
          - runner: ubuntu-22.04-arm
            arch: arm64
            sdk_arch: aarch64-linux-15      # 非 16K 页（getconf PAGESIZE=4096），已确认
            ffmpeg_ver: '5.1.2'

          # ---- 若 22.04 的 FFmpeg 4.4 太老编不过，改用这组（glibc 2.39 / FFmpeg 6.1）----
          #      注意：glibc 2.39 的产物在 Debian 11 等老系统上会直接跑不起来
          # - runner: ubuntu-24.04
          #   arch: x64
          #   sdk_arch: x64-linux-15v2
          # - runner: ubuntu-24.04-arm
          #   arch: arm64
          #   sdk_arch: aarch64-linux-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 编译依赖：工具链 + FFmpeg 开发库（CMake 里是 pkg_check_modules REQUIRED）
      # ---------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          # 注意：这里【故意不装】libav*-dev。系统自带 FFmpeg 4.4 太老，
          # 装了反而会跟源码构建的 FFmpeg 抢 pkg-config 解析。
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libssl-dev zlib1g-dev liblzma-dev libbz2-dev \
            libgnutls28-dev libsoxr-dev
          # nasm/yasm 只用于 x86 的 SIMD 优化，arm64 上装不上也不影响构建
          sudo apt-get install -y --no-install-recommends nasm yasm \
            || echo "::warning::nasm/yasm 未装上（arm64 上非必需，继续）"
          echo "==== 环境自检 ===="
          cmake --version | head -1
          g++ --version | head -1
          echo "glibc: $(ldd --version | head -1)"
          echo "系统自带 FFmpeg（仅参照，后面会用源码构建的覆盖）: $(pkg-config --modversion libavcodec 2>/dev/null || echo '无')"

      # ---------------------------------------------------------------------
      # ★ FFmpeg 必须 >= 5.1（源码构建）
      #
      # 为什么不能用系统包：AudioEngine.cpp 用的是 FFmpeg 5.1 才引入的
      # 「新声道布局 API」——
      #     AVChannelLayout            / av_channel_layout_default()
      #     AVCodecContext::ch_layout  / swr_alloc_set_opts2()
      # Ubuntu 22.04 自带的 FFmpeg 4.4 只有旧 API（channel_layout /
      # swr_alloc_set_opts），编译直接报：
      #     error: 'AVChannelLayout' was not declared in this scope
      #     error: 'AVCodecContext' has no member named 'ch_layout'
      # 项目自带的 install_ffmpeg.sh 提供的三个选项（5.1.2 / 7.1 / 8.0.1）
      # 也都是 >= 5.1，正好印证了这一点。
      #
      # 下面的 configure 选项【逐条复制自项目自带的 install_ffmpeg.sh
      # 里 get_ffmpeg_full_opts()】，只额外加了 --disable-programs
      # （不构建 ffmpeg/ffprobe 命令行，省几分钟，动态库完全不受影响）。
      #
      # ffmpeg_ver 怎么选：
      #   5.1.2 → soname 是 libavcodec.so.59，与 Debian 12 / Armbian bookworm
      #           系统自带的 FFmpeg 5.1.7 完全一致，目标机上不用另装 FFmpeg（推荐）
      #   7.1   → libavcodec.so.61（Ubuntu 24.04 系）
      #   8.0.1 → libavcodec.so.62（最新；注意作者那边 8.x 是「最小化」配置）
      # 目标机 FFmpeg 版本不一致也没关系 —— 产物里会附带本次构建出的 .so，
      # 用 LD_LIBRARY_PATH 指过去即可（见后面的 Stage artifact）。
      # ---------------------------------------------------------------------
      - name: Build FFmpeg from source
        run: |
          set -eo pipefail
          FFMPEG_VERSION='${{ matrix.ffmpeg_ver }}'
          echo "==== 构建 FFmpeg ${FFMPEG_VERSION}（仅动态库，不构建命令行程序）===="
          cd /tmp
          curl -fsSL --retry 3 --retry-delay 5 -o ffmpeg.tar.xz \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf ffmpeg.tar.xz
          cd "ffmpeg-${FFMPEG_VERSION}"

          OPTS=(
            --prefix=/usr/local
            --enable-shared
            --disable-static
            --enable-gpl
            --enable-version3
            --enable-gnutls
            --enable-libsoxr
            --disable-debug
            --disable-doc
            --disable-autodetect
            --disable-programs
            --enable-network
            --enable-protocol=file,http,https,tcp,pipe
            --enable-demuxer=flac,wav,dsf,dff,mov,aac,mp3,ogg
            --enable-decoder=flac,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,dsd_lsbf,dsd_msbf,dsd_lsbf_planar,dsd_msbf_planar,aac,mp3,vorbis
            --enable-parser=aac,flac,mpegaudio
            --enable-filter=aresample
          )

          echo "---- configure ----"
          ./configure "${OPTS[@]}" > /tmp/ffmpeg-configure.log 2>&1 || {
            echo "::error::FFmpeg configure 失败，日志末尾："
            tail -40 /tmp/ffmpeg-configure.log
            exit 1
          }
          echo "configure 通过"

          echo "---- make -j$(nproc)（这一步要几分钟，静默属正常）----"
          make -j"$(nproc)" > /tmp/ffmpeg-make.log 2>&1 || {
            echo "::error::FFmpeg 编译失败，日志末尾："
            tail -60 /tmp/ffmpeg-make.log
            exit 1
          }
          sudo make install
          sudo ldconfig

          echo "==== 装好的 FFmpeg ===="
          for p in libavcodec libavformat libavutil libswresample; do
            echo "  $p = $(pkg-config --modversion "$p")   libdir=$(pkg-config --variable=libdir "$p")"
          done
          MAJ="$(pkg-config --modversion libavcodec | cut -d. -f1)"
          [ "$MAJ" -ge 59 ] || { echo "::error::解析到的 libavcodec 主版本是 $MAJ（< 59），说明仍指向系统 FFmpeg 4.4"; exit 1; }
          ls -1 /usr/local/lib/libav*.so* /usr/local/lib/libswresample.so* 2>/dev/null | head -12

      # ---------------------------------------------------------------------
      # 取 SDK —— 方式 A：SDK 放私有仓库，用 PAT 拉（推荐，SDK 更新不用改 workflow）
      #   需要的 Secrets： SDK_REPO = top355/diretta-host-sdk   ← 纯 owner/repo，别带 https:// 和 .git
      #                    SDK_PAT  = 只给那个私有仓库 contents:read 的 fine-grained PAT
      # ---------------------------------------------------------------------
      - name: Fetch Diretta Host SDK (方式A - 私有仓库)
        env:
          RAW_SDK_REPO: ${{ secrets.SDK_REPO }}
          RAW_SDK_PAT: ${{ secrets.SDK_PAT }}
        run: |
          set -e
          # --- 容错：Secret 值从网页粘贴时常带空格/换行，先清洗 ---
          SDK_PAT="$(printf '%s' "${RAW_SDK_PAT:-}" | tr -d '[:space:]')"
          SDK_REPO="$(printf '%s' "${RAW_SDK_REPO:-}" | tr -d '[:space:]')"
          # 容忍 https://github.com/owner/repo、git@github.com:owner/repo、结尾 .git 或斜杠
          SDK_REPO="${SDK_REPO#https://github.com/}"
          SDK_REPO="${SDK_REPO#http://github.com/}"
          SDK_REPO="${SDK_REPO#git@github.com:}"
          SDK_REPO="${SDK_REPO%.git}"
          SDK_REPO="${SDK_REPO#/}"
          SDK_REPO="${SDK_REPO%/}"

          if [ -z "$SDK_PAT" ] || [ -z "$SDK_REPO" ]; then
            echo "::error::未配置 SDK_REPO / SDK_PAT。要么补 Secrets，要么改用方式B（见 workflow 注释）"
            exit 1
          fi
          case "$SDK_REPO" in
            */*) ;;
            *) echo "::error::SDK_REPO 格式应为 owner/repo（不带 https:// 与 .git），当前为: ${SDK_REPO}"; exit 1 ;;
          esac
          echo "将从私有仓库拉取 SDK: ${SDK_REPO}"

          rm -rf "$DIRETTA_SDK_PATH"; mkdir -p "$DIRETTA_SDK_PATH"
          ok=0

          # ---- 首选：REST API tarball ----
          # 绕开 git 协议的鉴权路径，且错误码可区分：
          #   401=token 串错/过期   404=token 未授权访问该仓库   403=权限不足或需 SSO
          echo "---- 方式1: REST API tarball ----"
          code=$(curl -sL -m 300 -o /tmp/sdk.tar.gz -w '%{http_code}' \
                   -H "Authorization: Bearer ${SDK_PAT}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${SDK_REPO}/tarball" || echo 000)
          printf '   HTTP %s，下载 %s 字节\n' "$code" "$(stat -c%s /tmp/sdk.tar.gz 2>/dev/null || echo 0)"
          if [ "$code" = "200" ] && tar tzf /tmp/sdk.tar.gz >/dev/null 2>&1; then
            tar xzf /tmp/sdk.tar.gz -C "$DIRETTA_SDK_PATH" --strip-components=1
            ok=1
          else
            # ★ 失败时务必把响应体打出来 —— GitHub 的 403 正文里就写着真正原因
            echo "   ---- 响应体原文（token 已脱敏）----"
            head -c 600 /tmp/sdk.tar.gz 2>/dev/null \
              | sed "s|${SDK_PAT}|***|g" | sed 's/^/     /' || true
            echo
            if grep -q 'Resource not accessible by personal access token' /tmp/sdk.tar.gz 2>/dev/null; then
              echo "   >>> 确诊：fine-grained PAT 缺 Contents 权限"
              echo "   >>> 修法：编辑该 token → Repository permissions → Contents 设为 Read-only"
              echo "   >>>       （改权限不会改变 token 值，无需重配 Secret）"
            fi
          fi

          # ---- 兜底：git clone（用户名依次试 oauth2 / x-access-token）----
          if [ "$ok" != "1" ]; then
            echo "---- 方式2: git clone ----"
            for u in oauth2 x-access-token; do
              rm -rf "$DIRETTA_SDK_PATH"; mkdir -p "$DIRETTA_SDK_PATH"
              if git clone --depth 1 --quiet \
                   "https://${u}:${SDK_PAT}@github.com/${SDK_REPO}.git" \
                   "$DIRETTA_SDK_PATH" 2>/tmp/sdk_clone.err; then
                echo "   git clone (${u}) 成功"
                ok=1; break
              fi
              echo "   git clone (${u}) 失败:"
              sed -E "s|${u}:[^@]*@|${u}:***@|g" /tmp/sdk_clone.err \
                | sed "s|${SDK_PAT}|***|g" | sed 's/^/     /' || true
            done
          fi

          # ---- 两种方式都失败 → 精确诊断，直接指出是 4 个原因里的哪一个 ----
          if [ "$ok" != "1" ]; then
            echo "::error::拉取 SDK 失败，见下方诊断"
            echo "---- ① token 归属与类型 ----"
            UCODE=$(curl -s -m 20 -H "Authorization: Bearer ${SDK_PAT}" https://api.github.com/user \
              -o /tmp/ghuser.json -w '%{http_code}' || echo 000)
            echo "   GET /user -> HTTP ${UCODE}"
            grep -o '"login":[^,]*' /tmp/ghuser.json 2>/dev/null | head -1 | sed 's/^/   /' || true
            grep -o '"message":[^,]*' /tmp/ghuser.json 2>/dev/null | head -1 | sed 's/^/   /' || true
            printf '   token 前缀: %s*** (长度 %s)\n' "$(printf '%s' "$SDK_PAT" | cut -c1-11)" "${#SDK_PAT}"
            curl -s -m 20 -o /dev/null -D - -H "Authorization: Bearer ${SDK_PAT}" \
              https://api.github.com/user | tr -d '\r' | grep -i '^x-oauth-scopes:' \
              | sed 's/^/   /' \
              || echo "   (无 x-oauth-scopes 头 → fine-grained PAT；classic PAT 会列出 scopes)"

            echo "---- ② token 能否看到目标仓库 ----"
            RCODE=$(curl -s -m 20 -H "Authorization: Bearer ${SDK_PAT}" \
              "https://api.github.com/repos/${SDK_REPO}" -o /tmp/ghrepo.json \
              -w '%{http_code}' || echo 000)
            echo "   GET /repos/${SDK_REPO} -> HTTP ${RCODE}"
            grep -o '"message":[^,]*' /tmp/ghrepo.json 2>/dev/null | head -1 | sed 's/^/   /' || true
            grep -o '"permissions":{[^}]*}' /tmp/ghrepo.json 2>/dev/null | head -1 | sed 's/^/   /' || true

            echo "---- ③ 判定（按上面两个状态码直接给结论）----"
            if [ "$UCODE" = "401" ]; then
              echo "   ⇒ token 串复制错了，或已过期 → 重新生成 PAT 并更新 Secret"
            elif [ "$RCODE" = "404" ]; then
              echo "   ⇒ PAT 的 Repository access 里没勾上该仓库（GET /repos 对未授权仓库故意返 404）"
            elif [ "$RCODE" = "403" ]; then
              echo "   ⇒ 组织仓库需 SSO 授权（按响应里的 URL 点一下授权）"
            elif [ "$RCODE" = "200" ]; then
              echo "   ⇒ token 能看到仓库（Repository access 正常），但读不到内容"
              echo "     ⇒ 缺 Contents 权限：编辑该 token → Repository permissions →"
              echo "        Contents = Read-only → 保存。token 值不变，Secret 不用改"
              echo "     ⇒ 若上一步响应体写的是 Resource not accessible by personal access token，"
              echo "        即为本因的确认"
            else
              echo "   ⇒ 未归类的组合，见上面 HTTP 码与响应体"
            fi
            echo "   （注：日志里仓库名显示为 *** 是 GitHub 的 secret 脱敏，不是写错）"
            exit 1
          fi
          echo "SDK 已拉取到: $DIRETTA_SDK_PATH"
          ls -1 "$DIRETTA_SDK_PATH" | head -10

      # ---------------------------------------------------------------------
      # 取 SDK —— 方式 B：gpg 加密包提交进本仓库，口令存 Secrets
      #   适用：不想建私有仓库。把 sdk/DirettaHostSDK_148.tar.gz.gpg 提交上来，
      #         Secrets 里加 SDK_PASSPHRASE。
      #   启用方式：注释掉上面的「方式A」step，打开下面这段。
      # ---------------------------------------------------------------------
      # - name: Decrypt Diretta Host SDK (方式B - 加密包)
      #   env:
      #     SDK_PASSPHRASE: ${{ secrets.SDK_PASSPHRASE }}
      #   run: |
      #     set -e
      #     [ -n "${SDK_PASSPHRASE:-}" ] || { echo "::error::缺 SDK_PASSPHRASE"; exit 1; }
      #     mkdir -p "$DIRETTA_SDK_PATH"
      #     gpg --batch --yes --quiet --passphrase "$SDK_PASSPHRASE" \
      #         --decrypt sdk/DirettaHostSDK_148.tar.gz.gpg \
      #       | tar xz -C "$DIRETTA_SDK_PATH"

      # ---------------------------------------------------------------------
      # SDK 结构校验：CMake 会硬校验这两个 .a，缺一个就 FATAL_ERROR 直接停
      # ---------------------------------------------------------------------
      - name: Verify SDK layout
        run: |
          set -e
          echo "==== SDK 根目录 ===="
          ls -1 "$DIRETTA_SDK_PATH"
          # 兼容 SDK 解压后多套一层目录的情况
          if [ ! -d "$DIRETTA_SDK_PATH/lib" ]; then
            inner="$(dirname "$(find "$DIRETTA_SDK_PATH" -maxdepth 2 -type d -name lib | head -n1)")"
            if [ -n "$inner" ] && [ "$inner" != "." ]; then
              echo "SDK 多套了一层 ($inner)，上提一层"
              shopt -s dotglob
              mv "$inner"/* "$DIRETTA_SDK_PATH"/
              shopt -u dotglob
            fi
          fi
          [ -d "$DIRETTA_SDK_PATH/Host" ] || echo "::warning::没看到 Host/ 目录，头文件可能找不到"
          NEED_HOST="libDirettaHost_${{ matrix.sdk_arch }}.a"
          NEED_ACQUA="libACQUA_${{ matrix.sdk_arch }}.a"
          for f in "$NEED_HOST" "$NEED_ACQUA"; do
            if [ ! -f "$DIRETTA_SDK_PATH/lib/$f" ]; then
              echo "::error::缺少 $f"
              echo "---- 该 SDK 实际提供的变体 ----"
              ls -1 "$DIRETTA_SDK_PATH/lib" 2>/dev/null | head -40 || true
              exit 1
            fi
          done
          echo "SDK 校验通过: $NEED_HOST + $NEED_ACQUA"

      # ---------------------------------------------------------------------
      # 配置 + 编译
      # 关键：显式 -DDIRETTA_ARCH，不要依赖自动探测！
      #   云端 runner 是 AMD EPYC，CMakeLists 的 grep "amd.*zen 4" 可能命中，
      #   于是编出 -march=znver4 的二进制 —— 拿到没有 AVX512/Zen4 的机器上直接 SIGILL
      # ---------------------------------------------------------------------
      - name: Configure
        run: |
          set -e
          echo "==== cmake 将用到的 FFmpeg（应为 /usr/local 下源码构建的那套）===="
          for p in libavcodec libavformat libavutil libswresample; do
            echo "  $p = $(pkg-config --modversion "$p")   libdir=$(pkg-config --variable=libdir "$p")"
          done
          mkdir -p build && cd build
          cmake .. -DDIRETTA_ARCH=${{ matrix.sdk_arch }}
          echo "==== 实际选中的 SDK 变体 / 编译参数 ===="
          grep -i -E "Selecting Diretta SDK variant|Using Diretta SDK|compile_options|CMAKE_CXX_FLAGS" \
            CMakeCache.txt CMakeFiles/CMakeOutput.log 2>/dev/null | head -10 || true
          echo "==== cmake 最终解析到的 FFmpeg 库 / 头文件路径 ===="
          grep -i -E "FFMPEG_(LIBRARIES|LIBRARY_DIRS|INCLUDE_DIRS)" CMakeCache.txt 2>/dev/null | head -10 || true

      - name: Build
        run: |
          set -eo pipefail
          cd build
          # pipefail：不加的话 make 失败会被 tail 的 0 退出码吞掉，
          # 最后只看到一句 "ls: cannot access 'DirettaLocalPlayer'"，看不出真因
          make -j"$(nproc)" 2>&1 | tail -60
          echo "==== 产物 ===="
          ls -lh DirettaLocalPlayer
          file DirettaLocalPlayer
          echo "==== 运行时依赖的 FFmpeg soname（拿去对比目标机）===="
          objdump -p DirettaLocalPlayer 2>/dev/null | awk '/NEEDED/{print "  "$2}' | grep -E 'lib(av|sw)' || true
          echo "==== 链接的库 ===="
          ldd DirettaLocalPlayer || true
          echo "==== 需要的 glibc 版本（对比目标机用）===="
          objdump -T DirettaLocalPlayer 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5 || true

      # ---------------------------------------------------------------------
      # 打包：二进制 + 本次构建出的 FFmpeg 动态库
      #   目标机的 FFmpeg 版本/ soname 对不上时，把 libs/ 一起拷过去即可：
      #     chmod +x DirettaLocalPlayer
      #     LD_LIBRARY_PATH=./libs ./DirettaLocalPlayer
      # ---------------------------------------------------------------------
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist/libs
          cp build/DirettaLocalPlayer dist/
          chmod +x dist/DirettaLocalPlayer
          cp -a /usr/local/lib/libavcodec.so* /usr/local/lib/libavformat.so* \
                /usr/local/lib/libavutil.so* /usr/local/lib/libswresample.so* \
                dist/libs/ 2>/dev/null || true
          echo "==== dist 内容 ===="
          ls -lh dist dist/libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirettaLocalPlayer-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # 发布 Release（tag 推送 或 手动填了 release_tag 时）
      # 好处：Release 直链下载不需要登录，Armbian 上 wget 一把梭
      # ---------------------------------------------------------------------
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          OUT="DirettaLocalPlayer-linux-${{ matrix.arch }}.tar.gz"
          tar czf "$OUT" -C dist .
          ls -lh "$OUT"
          # 注意：notes 用 printf 拼，别在 YAML 块标量里写裸换行 ——
          # 掉到行首会让整个 workflow 解析失败
          NOTES="$(printf '%s\n' \
            "DirettaLocalPlayer 自动编译产物（${{ matrix.arch }} / SDK ${{ matrix.sdk_arch }} / FFmpeg ${{ matrix.ffmpeg_ver }}）" \
            "" \
            "内含二进制与本次构建出的 FFmpeg 动态库（libs/）。" \
            "目标机若无同 soname 的 FFmpeg，把 libs/ 一起拷过去：" \
            "  chmod +x DirettaLocalPlayer" \
            "  LD_LIBRARY_PATH=./libs ./DirettaLocalPlayer")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加附件"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$OUT" --clobber
          echo "已上传: $OUT → $TAG"

