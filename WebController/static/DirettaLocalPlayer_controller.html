        async function syncWithServer(sState, latency = 0) {
            if (!sState) return;

            // 1. 智能防抖：判断是否换了新专辑 (上下文巨变)
            let isNewContext = false;
            if (Math.abs((sState.duration || 0) - (state.duration || 0)) > 2) isNewContext = true;
            if (sState.playlist && state.playlist && sState.playlist.length !== state.playlist.length) isNewContext = true;

            // 如果不是新专辑，且处于锁定期，直接拦截，防止回弹
            if (!isNewContext && Date.now() < state.ignoreServerUntil) {
                if (sState.audioFmt) {
                    state.audioFmt = sState.audioFmt;
                    state.audioDetail = sState.audioDetail;
                    els.badgeFmt.textContent = sState.audioFmt;
                    els.badgeDetail.textContent = sState.audioDetail;
                    els.badgeContainer.classList.add('visible');
                    updateABUI(); // 更新 AB 按钮状态（DSD 格式时禁用）
                }
                return;
            }

            const isSettingsOpen = els.modal.classList.contains('open');
            if (!isSettingsOpen && sState.activeHost && sState.activeHost !== state.host) {
                state.host = sState.activeHost; localStorage.setItem('mp_host', state.host); showToast(`System switched to ${state.host}`); state.playlist = sState.playlist || []; renderPlaylist(); return;
            }
            const isLocalHasData = state.playlist && state.playlist.length > 0;
            const isRemoteEmpty = !sState.playlist || sState.playlist.length === 0;
            const isHostMatch = state.host === sState.activeHost;

            // [Simplified] Abnormal Interruption Detection Removed

            if (!isRemoteEmpty || !isLocalHasData) { if (JSON.stringify(sState.playlist) !== JSON.stringify(state.playlist)) { state.playlist = sState.playlist || []; renderPlaylist(); } }
            if (sState.isCueMode !== undefined) { state.isCueMode = sState.isCueMode; }
            if (sState.duration > 0) state.duration = sState.duration;

            // ⭐ AB 状态同步
            if (sState.abStatus) {
                state.abStatus = sState.abStatus;
                updateABUI();
            }

            if (sState.playMode !== undefined && sState.playMode !== state.playMode) {
                if (state.playMode < 3) { // 只有在普通模式下才接受后端推送的模式
                    state.playMode = sState.playMode;
                }
                updateModeUI();
            }


            // --- 以下是重点修改部分 ---

            // 2. 时间锚点校准 (Time Anchor)
            if (sState.isPlaying) {
                state.isPlaying = true;

                // 计算后端认为的真实进度 (包含延迟补偿)
                const serverRealProgress = (sState.progress || 0) + latency;
                // 反推：歌曲是在前端什么时间开始的？
                const estimatedStartTime = Date.now() - (serverRealProgress * 1000);

                // ⭐ [核心加固] 只要偏差不超过 3s，维持本地时钟推算，实现"免疫网络抖动和后端解析真空"
                if (!state.localStartTime || Math.abs(estimatedStartTime - state.localStartTime) > 3000) {
                    state.localStartTime = estimatedStartTime;
                }
            } else {
                state.isPlaying = false;
                state.localStartTime = 0;
                state.progress = sState.progress || 0;
            }
            updatePlayBtnState();

            // 3. 智能索引同步
            const remoteIdx = parseInt(sState.currentIdx || 0);
            const remoteCover = sState.cover || '/data/default.jpg';

            // 只有当索引真的变了，才更新
            if (remoteIdx !== state.currentTrackIdx || state.currentMeta.cover !== remoteCover) {
                state.currentTrackIdx = remoteIdx;
                const track = state.playlist[remoteIdx];
                updatePlayerMeta(
                    track ? cleanTrackName(track.name) : state.currentMeta.title,
                    sState.contextName || 'Unknown',
                    remoteCover,
                    track ? track.format : ''
                );
                renderPlaylist();
            }

            // 格式标签更新
            if (sState.audioFmt && sState.audioDetail) {
                state.audioFmt = sState.audioFmt;
                state.audioDetail = sState.audioDetail;
                els.badgeFmt.textContent = sState.audioFmt;
                els.badgeDetail.textContent = sState.audioDetail;
                els.badgeContainer.classList.add('visible');
                updateABUI(); // 更新 AB 按钮状态（DSD 格式时禁用）
            } else { els.badgeContainer.classList.remove('visible'); }

            // 注意：这里不再调用 updateTimeDisplay()，交由 uiLoop 接管
        }

        setInterval(async () => {
            if (state.host && !state.isRestoring) {
                try {
                    const controller = new AbortController(); const id = setTimeout(() => controller.abort(), 2000);

                    // 1. 记录请求开始时间 
                    const reqStart = Date.now();

                    const res = await api('/api/status', { method: 'POST', body: JSON.stringify({ host: state.host }), signal: controller.signal }, true);
                    clearTimeout(id);

                    // 2. 计算延迟补偿 (RTT / 2)，最大限制 0.5s 
                    let latency = (Date.now() - reqStart) / 1000 / 2;
                    if (latency > 0.5) latency = 0.5;

                    if (res.statusRaw) state.lastStatus = res.statusRaw;

                    // 3. 传递延迟补偿给 syncWithServer
                    if (res.serverState) {
                        await syncWithServer(res.serverState, latency);
                    }

                    // [Feature] Auto-recovery UI
                    if (state.connErrors > 0) {
                        state.connErrors = 0;
                        if (state.errorToastId) {
                            // Hide "Connection Lost" toast immediately upon recovery
                            const t = document.getElementById(state.errorToastId);
                            if (t) t.classList.remove('show');
                            state.errorToastId = null;
                        }
                    }
                } catch (e) {
                    // [Fix] Handle Polling Errors
                    state.connErrors = (state.connErrors || 0) + 1;
                    if (state.connErrors > 3) {
                        if (!state.errorToastId) {
                            state.errorToastId = 'toast-conn-err'; // Fixed ID for connection error
                            showToast('⚠️ 与播放核心失去连接 (Connection Interrupted)', true, 0); // 0 = persistent
                        }
                    }
                }
            }
        }, 1000);

        async function checkConn() {
            // [Simplified] For local player, host is always assumed to be 127.0.0.1 (pre-configured)
            if (state.connErrors > 4) { showToast('服务连接中断，正在重试...'); return false; }

        window.playAlbum = async (el, id, album, artist, cover) => {
            if (state.isSwitching) return;
            if (!await showConfirm('播放确认', `是否开始播放专辑？\n${album}`)) return;
            if (!await checkConn()) return; state.isSwitching = true; if (el) el.classList.add('uploading-active');
            try {
                const res = await api('/api/play_album', { method: 'POST', body: JSON.stringify({ id, host: state.host, target: state.target }) });
                if (res.cover) updatePlayerMeta(album, res.contextName || artist, res.cover);
                // 设置CUE模式状态
                if (res.isCueMode !== undefined) state.isCueMode = res.isCueMode;
                openFullPlayer(); await loadPlaylist();

                if (state.playlist && state.playlist.length > 0) {
                    state.currentTrackIdx = 0;
                    updatePlayerMeta(cleanTrackName(state.playlist[0].name), album, res.cover, state.playlist[0].format);
                    renderPlaylist();
                }

                if (state.target) {
                    state.isPlaying = true;
                    updatePlayBtnState();
                } else {

        (function () {
            let currentLyrics = [];

            // 解析 LRC 格式
            function parseLrc(lrcText) {
                if (!lrcText) return [];
                const lines = lrcText.split('\n'); const result = [];
                const timeReg = /\[(\d{2}):(\d{2})(\.(\d{2,3}))?\]/g; const cleanReg = /<[^>]+>/g;
                for (const line of lines) {
                    const matches = [...line.matchAll(timeReg)];
                    if (matches.length > 0) {
                        const content = line.replace(timeReg, '').replace(cleanReg, '').trim();
                        for (const match of matches) {
                            const min = parseInt(match[1]); const sec = parseInt(match[2]); const msStr = match[4];
                            const ms = msStr ? (msStr.length === 3 ? parseInt(msStr) : parseInt(msStr) * 10) : 0;
                            const time = min * 60 + sec + ms / 1000;
                            result.push({ time, text: content });
                        }
                    }
                }
                return result.sort((a, b) => a.time - b.time);
            }

                });

                await api('/api/seek', {
                    method: 'POST',
                    body: JSON.stringify({ host: state.host, offset: offset > 0 ? `+${offset}` : `${offset}` })
                });
            };

            // [升级版] 通用居中滚动函数：使用 getBoundingClientRect 实现像素级精准
            function scrollToCenter(container, targetEl) {
                if (!container || !targetEl) return;

                const containerRect = container.getBoundingClientRect();
                const targetRect = targetEl.getBoundingClientRect();

                const relativeTop = targetRect.top - containerRect.top;

                const currentScroll = container.scrollTop;

                const targetTop = currentScroll + relativeTop - (container.clientHeight / 2) + (targetEl.clientHeight / 2);

                container.scrollTo({
                    top: targetTop,
                    behavior: 'smooth'
                });
            }

            // 【修改】同步滚动逻辑 syncLyrics 
            function syncLyrics(currentTime) {
                if (currentLyrics.length === 0) return;

                let trackStartTimeOffset = 0;
                if (state.playlist && state.playlist[state.currentTrackIdx]) {
                    trackStartTimeOffset = state.playlist[state.currentTrackIdx].absoluteStartTime || 0;
                }
                const relativeTime = currentTime - trackStartTimeOffset;

                let activeIdx = -1;
                for (let i = 0; i < currentLyrics.length; i++) {
                    if (relativeTime >= (currentLyrics[i].time + lyricOffset)) { activeIdx = i; } else { break; }
                }

                if (activeIdx !== lastActiveLineIdx) {

                    // 1. 同步 PC 端 
                    const oldPC = document.getElementById(`lrc-${lastActiveLineIdx}`);
                    if (oldPC) {
                        oldPC.classList.remove('active');
                        // 可选：失去焦点时恢复字体大小等（CSS已有transition处理） 
                    }

                    if (activeIdx !== -1) {
                        const currPC = document.getElementById(`lrc-${activeIdx}`);
                        if (currPC) {
                            currPC.classList.add('active');
                            // 【修改点】使用自定义计算函数替代 scrollIntoView 
                            const pcContainer = document.getElementById('lyrics-scroll-box');
                            if (pcContainer && pcContainer.offsetParent !== null) {
                                scrollToCenter(pcContainer, currPC);
                            }
                        }
                    }

                    // 2. 同步 手机端 
                    const oldMob = document.getElementById(`m-lrc-${lastActiveLineIdx}`);
                    if (oldMob) oldMob.classList.remove('active');

                    if (activeIdx !== -1) {
                        const currMob = document.getElementById(`m-lrc-${activeIdx}`);
                        if (currMob) {
                            currMob.classList.add('active');

                            // 仅当手机歌词界面显示时才滚动 
                            const mobContainer = document.getElementById('mob-lrc-text');
                            if (mobContainer && mobContainer.offsetParent !== null) {
                                // 【修改点】使用自定义计算函数替代 scrollIntoView 
                                scrollToCenter(mobContainer, currMob);
                            }
                        }
                    }

                    lastActiveLineIdx = activeIdx;
                }
            }
        })();

        // [修复] init 函数移动到最后，确保所有 Hook 生效
        (async function init() {
            const firstTab = document.querySelector('.view-section');
            if (firstTab) firstTab.classList.add('active');

            // 此时调用的是已经被 Hook 过的版本，PC端侧边栏将能正常加载
            loadRecommendations();

            // 异步连接序列
            await autoConnectSequence();
        })();

        // ================= Mobile Logic (Robust Version) ================= 
        let mobViewMode = 'song';

        window.switchMobView = (mode) => {
            const visuals = document.querySelector('.fp-visuals');
            const recContainer = document.getElementById('mob-rec-container');
            const lrcContainer = document.getElementById('mob-lrc-container');
            const tabRec = document.getElementById('tab-rec');
            const tabSong = document.getElementById('tab-song');
            const tabLrc = document.getElementById('tab-lrc');

            if (!visuals || !recContainer || !lrcContainer || !tabRec) {
                console.error("缺少必要的HTML元素，请检查ID是否正确插入");
                return;
            }

            mobViewMode = mode;

            tabRec.classList.remove('active');
            tabSong.classList.remove('active');
            tabLrc.classList.remove('active');
            document.getElementById('tab-' + mode).classList.add('active');

            if (mode === 'song') {
                visuals.classList.remove('hide-cover');
                recContainer.style.display = 'none';
                lrcContainer.style.display = 'none';
            } else {
                visuals.classList.add('hide-cover');
                // 改为 flex，与 CSS 保持一致，避免布局冲突 
                recContainer.style.display = (mode === 'rec') ? 'flex' : 'none';
                lrcContainer.style.display = (mode === 'lrc') ? 'flex' : 'none';
            }

            if (mode === 'rec') {
                if (!state.recsData) {
                    if (window.loadRecommendations) window.loadRecommendations();
                }
                loadMobRecs();
            }

            if (mode === 'lrc') {
                if (window.renderLyricsView) window.renderLyricsView();
            }
        };

        function loadMobRecs() {
            const box = document.getElementById('mob-rec-container');
            if (!box) return;

            if (!state.recsData || !state.recsData.random) {
                box.innerHTML = '<div style="margin:auto;color:#888;text-align:center;padding-top:40px;">数据加载中...</div>';
                if (window.loadRecommendations && (!state.recsData || !state.recsData.random)) {
                    window.loadRecommendations();
                }
                return;
            }

            const list = state.recsData.random.slice(0, 12);

            box.innerHTML = '<div class="m-rec-grid">' + list.map(a => ` 
                <div class="m-rec-item" onclick="playAlbum(this, '${a.id}','${escapeHtml(a.album)}','${escapeHtml(a.artist)}','${a.cover}')"> 
                    
                    <div class="m-rec-img-wrap"> 
                        <img src="${a.cover}" class="m-rec-img" loading="lazy" onerror="this.onerror=null;this.src='/data/default.jpg'"> 
                        ${a.format ? `<span class="m-rec-fmt">${a.format}</span>` : ''} 
                    </div> 

                    <div class="m-rec-info"> 
                        <div class="m-rec-album">${escapeHtml(a.album)}</div> 
                        <div class="m-rec-artist">${escapeHtml(a.artist)}</div> 
                    </div> 

                </div> 
            `).join('') + '</div>';
        }

        // 【新增】高频 UI 渲染循环 (60FPS)
        function uiLoop() {
            if (state.isPlaying && state.host && state.localStartTime) {
                const realTimeProgress = (Date.now() - state.localStartTime) / 1000;

                if (realTimeProgress >= 0) {
                    state.progress = realTimeProgress;
                    updateTimeDisplay();
                }
            }
            requestAnimationFrame(uiLoop);
        }
        requestAnimationFrame(uiLoop);

    </script>
</body>
